# Deck Slate engine back-end: a small, UI-free wrapper around the DeckCraft engine
# (the presentation engine from ArtCraft's open-source "deckcraft" repo, cloned in ../../../DeckSlate).
# The Android app (egui) will call this later; nothing here knows about egui, windows or Android UI.
[package]
name = "slate-deck"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Document Slate presentations back-end: open, render, edit, save and print slides through the DeckCraft engine"

# Own little workspace, so it builds on its own (with its own target dir) and doesn't get
# mixed into the main DocumentSlate app until we decide to wire it in.
[workspace]

[lib]
# rlib: used as a normal Rust library by the app.
crate-type = ["rlib"]

[dependencies]
# The engine: sessions, undo, every edit as a "command", file open/save, PDF export.
# Path deps into the upstream clone: we never edit DeckSlate/, we only build on it.
deckcraft-engine = { path = "../../../DeckSlate/crates/engine" }
deckcraft-model = { path = "../../../DeckSlate/crates/model" }
deckcraft-render = { path = "../../../DeckSlate/crates/render" }
deckcraft-pdf = { path = "../../../DeckSlate/crates/pdf" }
deckcraft-pptx = { path = "../../../DeckSlate/crates/pptx" }
deckcraft-fonts = { path = "../../../DeckSlate/crates/fonts" }
deckcraft-geom = { path = "../../../DeckSlate/crates/geom" }
# Text layout (caret and selection rectangles of the text being typed).
deckcraft-text = { path = "../../../DeckSlate/crates/text" }
# Commands take and return JSON values.
serde_json = "1"
# Reading the original .pptx package (zip) to spot content the engine might drop on save.
zip = { version = "3", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Tests build a small .pptx with a picture in it.
image = { version = "0.25", default-features = false, features = ["png"] }

# Same patches DeckSlate's own Cargo.toml uses for crates the engine pulls in.
#  - krilla: craft-pdf (PDF export) needs the storytold fork of this PDF writer.
#  - epaint_default_fonts: only its last-resort font file (Ubuntu Light) is used. Pinned to the same
#    egui fork rev (6d518fc) the main app uses, so the two never disagree.
# NOTE: the main app (DocumentSlate/Cargo.toml) pins krilla at craft-libs rev 6e03f65 (WordSlate's);
# DeckSlate wants rev 63196e6. When this crate joins the app, one rev has to win - see the report.
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "63196e66f3033a6623eb629af95a104d26986725", version = "=0.8.2" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
strip = true
lto = "thin"

# Same "small" settings the app uses for the phone APK, to measure size.
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
